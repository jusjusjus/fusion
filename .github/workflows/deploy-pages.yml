name: Deploy to GitHub Pages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# Only one deployment at a time; cancel any in-progress run for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: magnetic-field-explorer/package-lock.json

      - name: Install dependencies
        working-directory: magnetic-field-explorer
        run: npm ci

      - name: Build
        working-directory: magnetic-field-explorer
        run: npm run build

      - name: Deploy to gh-pages branch
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: magnetic-field-explorer/dist
          branch: gh-pages
          clean: true
