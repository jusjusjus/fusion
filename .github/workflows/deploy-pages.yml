name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time; cancel any in-progress run for the same ref.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tagged: ${{ steps.tag.outputs.tagged }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tagged=true" >> $GITHUB_OUTPUT
          elif git describe --exact-match --match 'v*' HEAD 2>/dev/null; then
            echo "tagged=true" >> $GITHUB_OUTPUT
          else
            echo "tagged=false" >> $GITHUB_OUTPUT
          fi

  build:
    needs: check
    if: needs.check.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            landing-page/package-lock.json
            magnetic-field-explorer/package-lock.json
            plasma-physics/package-lock.json
            fusion-reactions/package-lock.json
            fusion-fuel-cycle/package-lock.json

      - name: Install landing-page dependencies
        working-directory: landing-page
        run: npm ci

      - name: Build landing page
        working-directory: landing-page
        run: npm run build

      - name: Install magnetic-field-explorer dependencies
        working-directory: magnetic-field-explorer
        run: npm ci

      - name: Build magnetic-field-explorer
        working-directory: magnetic-field-explorer
        run: npm run build

      - name: Install plasma-physics dependencies
        working-directory: plasma-physics
        run: npm ci

      - name: Build plasma-physics
        working-directory: plasma-physics
        run: npm run build

      - name: Install fusion-reactions dependencies
        working-directory: fusion-reactions
        run: npm ci

      - name: Build fusion-reactions
        working-directory: fusion-reactions
        run: npm run build

      - name: Install fusion-fuel-cycle dependencies
        working-directory: fusion-fuel-cycle
        run: npm ci

      - name: Build fusion-fuel-cycle
        working-directory: fusion-fuel-cycle
        run: npm run build

      - name: Merge build outputs
        run: |
          mkdir -p site
          cp -r landing-page/dist/. site/
          cp -r magnetic-field-explorer/dist/. site/
          cp -r plasma-physics/dist/. site/
          cp -r fusion-reactions/dist/. site/
          cp -r fusion-fuel-cycle/dist/. site/

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: [check, build]
    if: needs.check.outputs.tagged == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
